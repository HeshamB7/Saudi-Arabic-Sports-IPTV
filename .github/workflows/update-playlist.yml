name: Update merged IPTV playlist

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-playlist.yml"
      - "scripts/merge_playlists.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Merge source playlists and remove duplicates
        run: python scripts/merge_playlists.py
      - name: Commit updated playlist
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "Playlist is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Update merged IPTV playlist"
          git push
